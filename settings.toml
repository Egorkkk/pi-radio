[difm]
username = "ad.rasao@gmail.com"
password = ""
listen_key = "ca64cdc02f76c2c2"
network = "di"
stream_quality = "premium_high"
request_timeout_seconds = 15.0
channels_cache_file = "cache/difm_channels.json"

[mpv]
executable = "mpv"
audio_device = "auto"
cache_seconds = 8.0
reconnect_delay_seconds = 3.0
idle_mode = true
extra_args = [
  "--no-video",
  "--force-window=no",
  "--volume=100"
]

[platform]
mode = "pi"
fullscreen = true
framebuffer_device = "/dev/fb0"
width = 480
height = 320
fps = 60

[persistence]
state_file = "runtime_state.json"
save_on_station_change = true

[input]
keyboard_enabled = true
encoder_support_enabled = false
touch_support_enabled = true
volume_adc_enabled = false
power_switch_support_enabled = false

[encoders]
enabled = false

[encoders.genre]
pin_a = 17
pin_b = 27
reverse_direction = false
steps_per_detent = 1
debounce_ms = 2

[encoders.station]
pin_a = 22
pin_b = 23
reverse_direction = false
steps_per_detent = 1
debounce_ms = 2

[encoders.tuning]
acceleration_enabled = true
fast_turn_window_ms = 120
fast_turn_threshold = 3
fast_turn_multiplier = 2
max_steps_per_event = 3
